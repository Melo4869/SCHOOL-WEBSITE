<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UQ Course Selection System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="screen active">
        <div class="background-overlay">
            <img src="images/course-bg.png" alt="UQ Campus" class="background-image">
            <div class="background-dim"></div>
        </div>

        <div class="content-wrapper">
            <div class="login-container">
                <div class="login-form">
                    <h2 class="login-title">Student Login</h2>

                    <form id="login-form">
                        <div class="form-group">
                            <label for="username">Student ID / Username</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                                <input type="text" id="username" placeholder="Enter your student ID or username" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="password">Password</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                                </svg>
                                <input type="password" id="password" placeholder="Enter your password" required>
                            </div>
                        </div>

                        <div class="form-options">
                            <label class="checkbox-label">
                                <input type="checkbox">
                                <span>Remember me</span>
                            </label>
                            <a href="#" class="forgot-link">Forgot password?</a>
                        </div>

                        <button type="submit" class="btn-login">Login</button>
                    </form>

                    <div class="signup-link">
                        <p>Don't have an account? <a href="#">Sign up now</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Course Selection Screen -->
    <div id="course-screen" class="screen">
        <div class="background-overlay">
            <img src="images/login-bg.png" alt="UQ Campus" class="background-image">
            <div class="background-gradient"></div>
        </div>

        <div class="content-wrapper">
            <!-- Header -->
            <div class="header">
                <button id="logout-btn" class="btn-logout">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span>退出</span>
                </button>
            </div>

            <!-- Main Content -->
            <div class="main-content">
                <div class="content-inner">
                    <!-- Title -->
                    <div class="page-title">
                        <h1>Explore Study Areas</h1>
                    </div>

                    <!-- Search Bar -->
                    <div class="search-section">
                        <div class="search-wrapper">
                            <input type="text" id="search-input" placeholder="Search for a study area" class="search-input">
                            <button id="search-btn" class="btn-search">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <path d="m21 21-4.35-4.35"></path>
                                </svg>
                                <span class="search-text">Search</span>
                            </button>
                        </div>
                    </div>

                    <!-- Browse By Category Title -->
                    <div class="section-title">
                        <h2>Browse By Category</h2>
                    </div>

                    <!-- Course Modules -->
                    <div id="modules-container" class="modules-grid">
                        <!-- Modules will be populated by JavaScript -->
                    </div>

                    <!-- No Results Message -->
                    <div id="no-results" class="no-results" style="display: none;">
                        <p>No study areas found matching "<span id="search-term"></span>"</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
